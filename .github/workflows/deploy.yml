name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Daily rebuild so the "X% fanden das hilfreich" header badge (baked in
    # at build time from Matomo, not fetched live client-side) doesn't go
    # stale between content pushes.
    - cron: '17 4 * * *'

# Least privilege per job: only the deploy job may write to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: every content page shows the commit that last
          # changed it (src/lib/last-commit.ts); a shallow clone would not.
          fetch-depth: 0

      # The same pnpm as the private monorepo's packageManager (checked by
      # scripts/ci-workflows.test.mjs there).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.7.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5

      - run: pnpm run check:links

      # Snapshot the sitemap that is live right now, before this deploy
      # replaces it -- the IndexNow job below reports only what changed.
      - name: Fetch live sitemap
        run: curl -fsS --max-time 20 -o "$RUNNER_TEMP/live-sitemap.xml" https://ki-einfach-verstehen.de/sitemap-0.xml || echo "::warning::live sitemap not reachable, every URL counts as new"

      - run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATOMO_READONLY_TOKEN: ${{ secrets.MATOMO_READONLY_TOKEN }}
          # The community board is live (go-live 2026-10-02): Bausteine show
          # the ask button and widget, the community page links into it.
          PUBLIC_COMMUNITY_LIVE: "true"

      - name: IndexNow payload
        id: indexnow
        run: |
          node scripts/indexnow.mjs "$RUNNER_TEMP/live-sitemap.xml" dist/sitemap-0.xml > "$RUNNER_TEMP/indexnow.json"
          { echo 'payload<<EOF'; cat "$RUNNER_TEMP/indexnow.json"; echo; echo 'EOF'; } >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # Tell Bing & co. (IndexNow) which URLs changed, now that they are live.
      # Google ignores IndexNow and works from the sitemap. Best effort: a
      # failed ping only warns, the deploy above already succeeded.
      - name: Ping IndexNow
        if: needs.build.outputs.indexnow != ''
        timeout-minutes: 2
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          echo "$PAYLOAD" | jq -r '.urlList[]'
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data "$PAYLOAD") || status=000
          case "$status" in
            200|202) echo "IndexNow accepted ($status)" ;;
            *) echo "::warning::IndexNow returned $status" ;;
          esac
